[project]
name = "all-weather-rotation"
version = "0.1.0"
description = "Tinyshare-based all weather rotation backtest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tinyshare>=0.1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "examples/all_weather_rotation_backtest",
]
testpaths = ["tests"]
addopts = "-q"
